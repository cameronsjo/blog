<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Sploot's head in profile, one rect per run of this 16×16 grid (2 units a
       pixel). Page tokens can't reach a favicon, so the two colors are the
       palette's dark bg and accent hexes.
       ................
       .....#....#.....
       .....##...##....
       ....###..###....
       ....#########...
       ...###########..
       ...######.####..
       ...############.
       ...#############
       ...###########..
       ...#########....
       ...########.....
       ...########.....
       ..#########.....
       ..#########.....
       ................
  -->
  <rect width="32" height="32" rx="7" fill="#292c33" />
  <g fill="#dbbb6f" shape-rendering="crispEdges">
    <rect x="10" y="2" width="2" height="2"/>
    <rect x="20" y="2" width="2" height="2"/>
    <rect x="10" y="4" width="4" height="2"/>
    <rect x="20" y="4" width="4" height="2"/>
    <rect x="8" y="6" width="6" height="2"/>
    <rect x="18" y="6" width="6" height="2"/>
    <rect x="8" y="8" width="18" height="2"/>
    <rect x="6" y="10" width="22" height="2"/>
    <rect x="6" y="12" width="12" height="2"/>
    <rect x="20" y="12" width="8" height="2"/>
    <rect x="6" y="14" width="24" height="2"/>
    <rect x="6" y="16" width="26" height="2"/>
    <rect x="6" y="18" width="22" height="2"/>
    <rect x="6" y="20" width="18" height="2"/>
    <rect x="6" y="22" width="16" height="2"/>
    <rect x="6" y="24" width="16" height="2"/>
    <rect x="4" y="26" width="18" height="2"/>
    <rect x="4" y="28" width="18" height="2"/>
  </g>
</svg>
